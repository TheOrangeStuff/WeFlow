name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict WeFlow/core
      - run: pytest -q
      - name: Screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: tests/artifacts/*.png
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.name }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, optional: false }
          - { name: macOS x86_64, os: macos-15-intel, optional: true }
          - { name: Windows x64, os: windows-latest, optional: false }
    env:
      QT_QPA_PLATFORM: offscreen
      WEFLOW_SMUGMUG_API_KEY: ${{ secrets.WEFLOW_SMUGMUG_API_KEY }}
      WEFLOW_SMUGMUG_API_SECRET: ${{ secrets.WEFLOW_SMUGMUG_API_SECRET }}
      WEFLOW_FLICKR_API_KEY: ${{ secrets.WEFLOW_FLICKR_API_KEY }}
      WEFLOW_FLICKR_API_SECRET: ${{ secrets.WEFLOW_FLICKR_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[build]"

      # ---------------------------------------------------------------- macOS
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "No certificate configured: the build will be unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build .app and .dmg
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./packaging/build_macos.sh
      - name: Launch check
        if: runner.os == 'macOS'
        run: |
          export WeFlow_DATA_DIR="$RUNNER_TEMP/weflow-data"
          dist/WeFlow.app/Contents/MacOS/WeFlow --smoke-test

      # -------------------------------------------------------------- Windows
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build folder and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $env:WINDOWS_CERT_FILE = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($env:WINDOWS_CERT_FILE, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          }
          ./packaging/build_windows.ps1
      - name: Launch check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WeFlow_DATA_DIR = Join-Path $env:RUNNER_TEMP "weflow-data"
          $run = Start-Process -FilePath "dist\WeFlow\WeFlow.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "WeFlow exited with $($run.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: WeFlow-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
